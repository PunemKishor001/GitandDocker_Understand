
name: Playwright Docker Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myfirst-docker .

      - name: Run Pytest in Docker
        run: docker run --rm myfirst-docker
