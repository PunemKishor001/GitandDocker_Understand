
name: Playwright Docker Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t myfirst-docker .

      - name: Run Pytest inside Docker
        run: docker run --rm myfirst-docker
